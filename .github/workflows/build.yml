
name: Build

permissions:
  contents: write           # needed for GITHUB_TOKEN to push the runtime branch
  actions: read
  checks: write
  # Only allow writing checks; contents write is granted explicitly for the push step

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:   # allow manual run (useful after forking or templating)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v3
        with:
          version: stable

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Lint with ESLint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Publish runtime snapshot
        # create/update a lightweight tag containing compiled code + node_modules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # stash build output before touching git state
          TMPDIR=$(mktemp -d)
          cp -r dist node_modules package.json bun.lock data "$TMPDIR/" || true

          # create temporary branch so git commit works, then tag that commit
          git checkout --orphan temp-runtime
          git rm -rf . >/dev/null 2>&1 || true
          cp -r "$TMPDIR"/* .
          git add dist node_modules package.json bun.lock data
          git commit -m "runtime build for ${GITHUB_SHA}"

          # force-create tag pointing at this commit
          git tag -f runtime
          # push tag via token
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" runtime
          # temporary orphan branch can be garbage-collected automatically