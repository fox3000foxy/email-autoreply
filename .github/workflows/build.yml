
name: Build

permissions:
  contents: read
  actions: read
  checks: write
  # Only allow writing checks, everything else is read-only

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with ESLint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Publish runtime snapshot
        # push compiled code + node_modules to a dedicated branch for cron job
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # copy build result somewhere safe before wiping worktree
          TMPDIR=$(mktemp -d)
          cp -r dist node_modules package.json pnpm-lock.yaml "$TMPDIR/" || true

          # switch to an empty orphan branch
          git checkout --orphan runtime
          git rm -rf . >/dev/null 2>&1 || true

          # restore the artifacts from temp location
          cp -r "$TMPDIR"/* .
          git add dist node_modules package.json pnpm-lock.yaml
          git commit -m "runtime build for ${GITHUB_SHA}"
          git push --force origin HEAD:runtime
