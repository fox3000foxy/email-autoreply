
name: Build

permissions:
  contents: write           # needed for GITHUB_TOKEN to push the runtime branch
  actions: read
  checks: write
  # Only allow writing checks; contents write is granted explicitly for the push step

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:   # allow manual run (useful after forking or templating)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint with ESLint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Publish runtime snapshot
        # create/update a lightweight tag containing compiled code + node_modules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # stash build output before touching git state
          TMPDIR=$(mktemp -d)
          cp -r dist node_modules package.json pnpm-lock.yaml "$TMPDIR/" || true

          # create temporary branch so git commit works, then tag that commit
          git checkout --orphan temp-runtime
          git rm -rf . >/dev/null 2>&1 || true
          cp -r "$TMPDIR"/* .
          git add dist node_modules package.json pnpm-lock.yaml
          git commit -m "runtime build for ${GITHUB_SHA}"

          # force-create tag pointing at this commit
          git tag -f runtime
          # push tag via token
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" runtime
          # delete temporary branch locally
          git checkout master
          git branch -D temp-runtime || true
