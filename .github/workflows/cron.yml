name: Email Auto Reply Action

on:
  schedule:
    # - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-mails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout runtime snapshot
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: refs/tags/runtime    # pull the pre-built tag instead of a branch
          fetch-depth: 1
          fetch-tags: true          # ensure the tag is fetched

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # pnpm and caching not required: runtime snapshot already contains node_modules

      - name: Restore lastId from state tag
        shell: bash
        run: |
          mkdir -p data
          git fetch origin --tags lastid || true
          git show refs/tags/lastid:data/lastId > data/lastId || true

      - name: Prepare accounts config
        shell: bash
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: |
          mkdir -p data
          if [ -n "${ACCOUNTS_JSON:-}" ]; then
            printf "%s" "$ACCOUNTS_JSON" > data/accounts.json
          elif [ -f data/accounts.example.json ]; then
            cp data/accounts.example.json data/accounts.json
          else
            echo "Missing accounts config: define secret ACCOUNTS_JSON or commit data/accounts.example.json"
            exit 1
          fi

          node -e "JSON.parse(require('node:fs').readFileSync('data/accounts.json','utf8'))"

      # dependencies and build are skipped, code already compiled in runtime branch

      - name: Process new emails in action mode
        env:
          MAILUSER: ${{ secrets.MAILUSER }}
          MAILPASS: ${{ secrets.MAILPASS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_TLS: ${{ secrets.IMAP_TLS }}
          NODEMAILER_HOST: ${{ secrets.NODEMAILER_HOST }}
          NODEMAILER_PORT: ${{ secrets.NODEMAILER_PORT }}
          NODEMAILER_SECURE: ${{ secrets.NODEMAILER_SECURE }}
          MANUAL_REPLYER: ${{ secrets.MANUAL_REPLYER }}
        # runtime branch already contains node_modules so call node directly
        run: node dist/index.js --action

      - name: Publish lastId as state tag
        shell: bash
        run: |
          LAST_ID_CONTENT="0"
          if [ -f data/lastId ]; then
            LAST_ID_CONTENT="$(cat data/lastId)"
          fi

          git switch --orphan lastid-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p data
          printf "%s\n" "${LAST_ID_CONTENT}" > data/lastId

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lastId
          git commit -m "lastId snapshot for ${GITHUB_SHA}"
          git tag -f lastid
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" lastid